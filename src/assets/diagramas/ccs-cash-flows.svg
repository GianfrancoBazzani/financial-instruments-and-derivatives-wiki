<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-size="15">
<defs>
  <marker id="eur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--g-b)"/></marker>
  <marker id="usd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--g-c)"/></marker>
</defs>

<text x="20" y="29" font-weight="bold">Flujos de un cross-currency swap EUR/USD</text>
<line x1="620" y1="24" x2="650" y2="24" stroke="var(--g-b)" stroke-width="2.5"/>
<text x="658" y="29" font-size="13">EUR</text>
<line x1="710" y1="24" x2="740" y2="24" stroke="var(--g-c)" stroke-width="2.5"/>
<text x="748" y="29" font-size="13">USD</text>

<!-- separadores de panel -->
<line x1="275" y1="58" x2="275" y2="300" stroke="var(--g-grid)" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="545" y1="58" x2="545" y2="300" stroke="var(--g-grid)" stroke-width="1" stroke-dasharray="4 4"/>

<!-- títulos de panel -->
<text x="140" y="72" text-anchor="middle" font-weight="bold">1. Inicio</text>
<text x="410" y="72" text-anchor="middle" font-weight="bold">2. Cada trimestre</text>
<text x="680" y="72" text-anchor="middle" font-weight="bold">3. Vencimiento</text>

<!-- cajas de la empresa -->
<rect x="80" y="88" width="120" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="140" y="115" text-anchor="middle" font-weight="bold">Empresa</text>
<rect x="350" y="88" width="120" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="410" y="115" text-anchor="middle" font-weight="bold">Empresa</text>
<rect x="620" y="88" width="120" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="680" y="115" text-anchor="middle" font-weight="bold">Empresa</text>

<!-- cajas del dealer -->
<rect x="80" y="230" width="120" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="140" y="257" text-anchor="middle" font-weight="bold">Dealer</text>
<rect x="350" y="230" width="120" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="410" y="257" text-anchor="middle" font-weight="bold">Dealer</text>
<rect x="620" y="230" width="120" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="680" y="257" text-anchor="middle" font-weight="bold">Dealer</text>

<!-- 1. inicio: principales al tipo spot -->
<line x1="110" y1="135" x2="110" y2="227" stroke="var(--g-b)" stroke-width="2.2" marker-end="url(#eur)"/>
<text x="100" y="185" font-size="13" text-anchor="end">EUR 85M</text>
<line x1="170" y1="227" x2="170" y2="135" stroke="var(--g-c)" stroke-width="2.2" marker-end="url(#usd)"/>
<text x="180" y="185" font-size="13">USD 100M</text>

<!-- 2. cada trimestre: intereses -->
<line x1="380" y1="135" x2="380" y2="227" stroke="var(--g-c)" stroke-width="2.2" marker-end="url(#usd)"/>
<text x="370" y="170" font-size="13" text-anchor="end">SOFR</text>
<text x="370" y="186" font-size="13" text-anchor="end">sobre</text>
<text x="370" y="202" font-size="13" text-anchor="end">USD 100M</text>
<line x1="440" y1="227" x2="440" y2="135" stroke="var(--g-b)" stroke-width="2.2" marker-end="url(#eur)"/>
<text x="450" y="170" font-size="13">€STR + b</text>
<text x="450" y="186" font-size="13">sobre</text>
<text x="450" y="202" font-size="13">EUR 85M</text>

<!-- 3. vencimiento: principales de vuelta al tipo spot inicial -->
<line x1="650" y1="135" x2="650" y2="227" stroke="var(--g-c)" stroke-width="2.2" marker-end="url(#usd)"/>
<text x="640" y="185" font-size="13" text-anchor="end">USD 100M</text>
<line x1="710" y1="227" x2="710" y2="135" stroke="var(--g-b)" stroke-width="2.2" marker-end="url(#eur)"/>
<text x="720" y="185" font-size="13">EUR 85M</text>

<!-- notas -->
<text x="140" y="300" text-anchor="middle" font-size="13" opacity="0.75">al tipo de cambio spot 1.1765</text>
<text x="410" y="300" text-anchor="middle" font-size="13" opacity="0.75">intereses en cada divisa</text>
<text x="680" y="300" text-anchor="middle" font-size="13" opacity="0.75">al mismo tipo de cambio 1.1765</text>
</svg>
