<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" font-size="15">
<defs>
  <marker id="fx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--g-b)"/></marker>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--g-c)"/></marker>
</defs>

<text x="20" y="29" font-weight="bold">Transformar un pasivo</text>
<line x1="540" y1="24" x2="570" y2="24" stroke="var(--g-b)" stroke-width="2.5"/>
<text x="578" y="29" font-size="13">tipo fijo</text>
<line x1="670" y1="24" x2="700" y2="24" stroke="var(--g-c)" stroke-width="2.5"/>
<text x="708" y="29" font-size="13">tipo variable</text>

<!-- prestamistas externos -->
<rect x="85" y="56" width="130" height="44" rx="4" fill="none" stroke="var(--g-muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="150" y="83" text-anchor="middle">Prestamistas</text>
<rect x="605" y="56" width="130" height="44" rx="4" fill="none" stroke="var(--g-muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="670" y="83" text-anchor="middle">Prestamistas</text>

<!-- pagos de los préstamos -->
<line x1="150" y1="178" x2="150" y2="103" stroke="var(--g-c)" stroke-width="2.2" marker-end="url(#fl)"/>
<text x="162" y="145" font-size="14">variable + 0.1%</text>
<line x1="670" y1="178" x2="670" y2="103" stroke="var(--g-b)" stroke-width="2.2" marker-end="url(#fx)"/>
<text x="658" y="145" font-size="14" text-anchor="end">3.2%</text>

<!-- partes del swap -->
<rect x="80" y="180" width="140" height="56" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="150" y="205" text-anchor="middle" font-weight="bold">Empresa A</text>
<text x="150" y="225" text-anchor="middle" font-size="13" opacity="0.75">pagador</text>
<rect x="350" y="180" width="120" height="56" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="410" y="213" text-anchor="middle" font-weight="bold">Dealer</text>
<rect x="600" y="180" width="140" height="56" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="670" y="205" text-anchor="middle" font-weight="bold">Empresa B</text>
<text x="670" y="225" text-anchor="middle" font-size="13" opacity="0.75">receptor</text>

<!-- pagos del swap -->
<line x1="223" y1="198" x2="347" y2="198" stroke="var(--g-b)" stroke-width="2.2" marker-end="url(#fx)"/>
<text x="285" y="190" font-size="14" text-anchor="middle">3%</text>
<line x1="347" y1="220" x2="223" y2="220" stroke="var(--g-c)" stroke-width="2.2" marker-end="url(#fl)"/>
<text x="285" y="240" font-size="14" text-anchor="middle">variable</text>
<line x1="473" y1="198" x2="597" y2="198" stroke="var(--g-b)" stroke-width="2.2" marker-end="url(#fx)"/>
<text x="535" y="190" font-size="14" text-anchor="middle">2.97%</text>
<line x1="597" y1="220" x2="473" y2="220" stroke="var(--g-c)" stroke-width="2.2" marker-end="url(#fl)"/>
<text x="535" y="240" font-size="14" text-anchor="middle">variable</text>

<!-- resultados netos -->
<text x="150" y="272" text-anchor="middle" font-weight="bold">paga 3.1% neto</text>
<text x="410" y="258" text-anchor="middle" font-size="13" opacity="0.75">se queda el 0.03%</text>
<text x="670" y="272" text-anchor="middle" font-weight="bold">paga variable + 0.23% neto</text>
</svg>
